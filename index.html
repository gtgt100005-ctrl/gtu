<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دعوة تخرج</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Amiri&display=swap" rel="stylesheet">
<style>
:root{--u:1vh;--g:#1f3a2c;--gold:#a38b5c;color-scheme:light}
@supports(height:1dvh){:root{--u:1dvh}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#e4e1d3;font-family:Amiri,'Noto Naskh Arabic','Geeza Pro','Damascus',Tahoma,serif;color:var(--g)}
.stage{position:absolute;top:0;left:50%;height:calc(var(--u)*100);aspect-ratio:941/1672;transform:translateX(-50%);overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:70% 85%;animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.035)}}
.sp{position:absolute;width:calc(var(--u)*2.8);height:calc(var(--u)*2.8);background:#d9c48f;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:tw 2.8s ease-in-out infinite;filter:drop-shadow(0 0 4px #fff)}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(45deg)}}
.txt{position:absolute;left:11%;right:13%;top:22%;height:37%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.txt>*{opacity:0;animation:up 1.2s forwards}
.bis{font-size:calc(var(--u)*2);color:#8a7448;animation-delay:.3s}
.pre{font-size:calc(var(--u)*2.4);margin-top:calc(var(--u)*.6);animation-delay:.7s}
h1{font-family:'Aref Ruqaa',Amiri,'Noto Naskh Arabic','Geeza Pro','Damascus',serif;font-size:calc(var(--u)*5.2);line-height:1.25;margin:calc(var(--u)*.4) 0;color:var(--g);text-shadow:0 2px 0 #fffdf3,0 6px 18px #1f3a2c33;animation-delay:1.1s}
.orn{width:55%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation-delay:1.4s}
.post{font-size:calc(var(--u)*2.3);margin-top:calc(var(--u)*.6);animation-delay:1.6s}
.card{margin-top:calc(var(--u)*1.2);padding:calc(var(--u)*1) calc(var(--u)*2.2);border:1px solid #a38b5c99;border-radius:14px;background:#fffdf3b8;backdrop-filter:blur(4px);font-size:calc(var(--u)*2.1);line-height:1.65;animation-delay:1.9s}
.cd{margin-top:calc(var(--u)*.9);color:#5c7a64;font-size:calc(var(--u)*1.9);animation-delay:2.2s}
button{pointer-events:auto;margin-top:calc(var(--u)*1);font:inherit;font-size:calc(var(--u)*2.3);color:#fffdf3;background:linear-gradient(135deg,#3d5c47,#1f3a2c);border:0;border-radius:30px;padding:calc(var(--u)*.9) calc(var(--u)*3);cursor:pointer;box-shadow:0 6px 16px #1f3a2c55;animation-delay:2.5s}
button:active{transform:scale(.95)}
.mus{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:10;width:44px;height:44px;margin:0;padding:0;border-radius:50%;font-size:20px;line-height:44px;text-align:center;opacity:1;animation:none;background:#fffdf3cc;color:#1f3a2c;border:1px solid #a38b5c99;box-shadow:0 4px 12px #1f3a2c44;backdrop-filter:blur(4px)}
.mus.off{opacity:.6}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
</style>
</head>
